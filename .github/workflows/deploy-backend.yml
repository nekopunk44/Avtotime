name: Deploy backend

# Runs only when backend code changes on main, plus a manual trigger.
on:
  push:
    branches: [main]
    paths:
      - 'Avtotime-1/backend/**'
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend to server
        run: |
          rsync -az \
            --exclude=node_modules \
            --exclude=public \
            --exclude='*.log' \
            --exclude='.mongo-*' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            Avtotime-1/backend/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/avtotime/backend/"

      - name: Rebuild and restart backend
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'cd /root/avtotime && docker compose up -d --build backend && docker image prune -f >/dev/null && docker compose ps backend'
