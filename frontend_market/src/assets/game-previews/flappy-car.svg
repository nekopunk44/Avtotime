<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-label="Flappy Car preview">
  <defs>
    <linearGradient id="fcSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="fcPipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#15803D"/>
      <stop offset="35%" stop-color="#4ADE80"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="fcCar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <clipPath id="fcFrame">
      <rect width="512" height="256" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#fcFrame)">
    <!-- Sky -->
    <rect width="512" height="256" fill="url(#fcSky)"/>

    <!-- Sun -->
    <circle cx="438" cy="38" r="22" fill="#FACC15"/>
    <circle cx="438" cy="38" r="32" fill="#FACC15" opacity="0.3"/>

    <!-- Clouds -->
    <g fill="white" opacity="0.9">
      <ellipse cx="70"  cy="44" rx="28" ry="8"/>
      <ellipse cx="95"  cy="38" rx="18" ry="6"/>
      <ellipse cx="360" cy="60" rx="22" ry="7"/>
    </g>

    <!-- Distant hills -->
    <path d="M 0,220 Q 100,200 200,212 T 400,206 T 512,214 L 512,256 L 0,256 Z" fill="#22C55E" opacity="0.4"/>

    <!-- Ground -->
    <rect x="0" y="232" width="512" height="24" fill="#4ADE80"/>
    <rect x="0" y="232" width="512" height="4" fill="#15803D"/>
    <!-- Ground stripes -->
    <g fill="#15803D" opacity="0.55">
      <rect x="0"   y="240" width="40" height="6" rx="2"/>
      <rect x="60"  y="246" width="40" height="6" rx="2"/>
      <rect x="120" y="240" width="40" height="6" rx="2"/>
      <rect x="180" y="246" width="40" height="6" rx="2"/>
      <rect x="240" y="240" width="40" height="6" rx="2"/>
      <rect x="300" y="246" width="40" height="6" rx="2"/>
      <rect x="360" y="240" width="40" height="6" rx="2"/>
      <rect x="420" y="246" width="40" height="6" rx="2"/>
      <rect x="480" y="240" width="40" height="6" rx="2"/>
    </g>

    <!-- === Pipe 1 (passed, behind car) === -->
    <g stroke="#14532D" stroke-width="2">
      <!-- Top pipe -->
      <rect x="138" y="0"   width="44" height="100" fill="url(#fcPipe)"/>
      <rect x="130" y="92"  width="60" height="18" fill="url(#fcPipe)" rx="2"/>
      <!-- Bottom pipe -->
      <rect x="130" y="178" width="60" height="18" fill="url(#fcPipe)" rx="2"/>
      <rect x="138" y="196" width="44" height="36" fill="url(#fcPipe)"/>
    </g>

    <!-- === Pipe 2 (ahead) === -->
    <g stroke="#14532D" stroke-width="2">
      <rect x="328" y="0"   width="44" height="80" fill="url(#fcPipe)"/>
      <rect x="320" y="72"  width="60" height="18" fill="url(#fcPipe)" rx="2"/>
      <rect x="320" y="158" width="60" height="18" fill="url(#fcPipe)" rx="2"/>
      <rect x="328" y="176" width="44" height="56" fill="url(#fcPipe)"/>
    </g>

    <!-- === Pipe 3 (far ahead) === -->
    <g stroke="#14532D" stroke-width="2">
      <rect x="478" y="0"   width="44" height="60" fill="url(#fcPipe)"/>
      <rect x="470" y="52"  width="60" height="18" fill="url(#fcPipe)" rx="2"/>
      <rect x="470" y="138" width="60" height="18" fill="url(#fcPipe)" rx="2"/>
      <rect x="478" y="156" width="44" height="76" fill="url(#fcPipe)"/>
    </g>

    <!-- === Car (flying through the gap) === -->
    <g transform="translate(220, 116) rotate(-6)">
      <!-- Speed lines behind -->
      <g stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7">
        <line x1="-44" y1="-2" x2="-22" y2="-2"/>
        <line x1="-50" y1="8"  x2="-22" y2="8"/>
        <line x1="-44" y1="18" x2="-22" y2="18"/>
      </g>
      <!-- Little wings flapping -->
      <path d="M -8,4 L -20,-10 L -14,4 Z" fill="#FACC15" stroke="#A16207" stroke-width="1.5"/>
      <path d="M 38,4 L 50,-10 L 44,4 Z" fill="#FACC15" stroke="#A16207" stroke-width="1.5"/>
      <!-- Car body -->
      <path d="M 0,22
               L -2,8
               Q -2,0 6,-2
               L 14,-2
               L 18,-10
               L 30,-10
               L 34,-2
               L 42,-2
               Q 50,0 50,8
               L 48,22 Z"
            fill="url(#fcCar)" stroke="#7F1D1D" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Windshield -->
      <path d="M 16,-2 L 20,-8 L 30,-8 L 34,-2 Z" fill="#BFDBFE"/>
      <!-- Headlight -->
      <rect x="44" y="6" width="5" height="5" rx="1.5" fill="#FEF3C7"/>
      <!-- Wheels (spinning - blurred ovals) -->
      <ellipse cx="6"  cy="22" rx="6" ry="5" fill="#0F172A"/>
      <ellipse cx="40" cy="22" rx="6" ry="5" fill="#0F172A"/>
      <circle cx="6"  cy="22" r="2" fill="#9CA3AF"/>
      <circle cx="40" cy="22" r="2" fill="#9CA3AF"/>
    </g>

    <!-- Score badge top-center -->
    <g transform="translate(232, 18)">
      <rect x="0" y="0" width="60" height="36" rx="18" fill="white" stroke="#1F2937" stroke-width="2.5"/>
      <text x="30" y="26" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="20" fill="#1F2937">23</text>
    </g>
  </g>
</svg>
