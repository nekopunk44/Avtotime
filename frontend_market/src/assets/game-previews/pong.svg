<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-label="Pong preview">
  <defs>
    <linearGradient id="pongBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0A0A0A"/>
      <stop offset="50%"  stop-color="#0F0F0F"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="pongGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- CRT screen frame -->
  <rect width="512" height="256" rx="28" fill="url(#pongBg)"/>

  <!-- Subtle scanlines -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="20" x2="512" y2="20"/>
    <line x1="0" y1="40" x2="512" y2="40"/>
    <line x1="0" y1="60" x2="512" y2="60"/>
    <line x1="0" y1="80" x2="512" y2="80"/>
    <line x1="0" y1="100" x2="512" y2="100"/>
    <line x1="0" y1="120" x2="512" y2="120"/>
    <line x1="0" y1="140" x2="512" y2="140"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="180" x2="512" y2="180"/>
    <line x1="0" y1="200" x2="512" y2="200"/>
    <line x1="0" y1="220" x2="512" y2="220"/>
    <line x1="0" y1="240" x2="512" y2="240"/>
  </g>

  <!-- Top & bottom field boundary lines -->
  <rect x="20" y="56" width="472" height="3" fill="#FFFFFF" opacity="0.85"/>
  <rect x="20" y="232" width="472" height="3" fill="#FFFFFF" opacity="0.85"/>

  <!-- Center dashed line -->
  <g fill="#FFFFFF" opacity="0.85">
    <rect x="254" y="64"  width="4" height="14"/>
    <rect x="254" y="84"  width="4" height="14"/>
    <rect x="254" y="104" width="4" height="14"/>
    <rect x="254" y="124" width="4" height="14"/>
    <rect x="254" y="144" width="4" height="14"/>
    <rect x="254" y="164" width="4" height="14"/>
    <rect x="254" y="184" width="4" height="14"/>
    <rect x="254" y="204" width="4" height="14"/>
  </g>

  <!-- Score (huge, retro 7-segment style) -->
  <g font-family="'Courier New', monospace" font-weight="900" fill="#FFFFFF">
    <text x="156" y="44" text-anchor="middle" font-size="34">07</text>
    <text x="356" y="44" text-anchor="middle" font-size="34">05</text>
  </g>

  <!-- Player labels -->
  <g font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFFFFF" opacity="0.6">
    <text x="156" y="20" text-anchor="middle">PLAYER 1</text>
    <text x="356" y="20" text-anchor="middle">PLAYER 2</text>
  </g>

  <!-- Left paddle -->
  <g>
    <rect x="34" y="100" width="12" height="60" fill="#FFFFFF"/>
    <!-- soft glow -->
    <rect x="32" y="98" width="16" height="64" fill="#FFFFFF" opacity="0.15"/>
  </g>

  <!-- Right paddle -->
  <g>
    <rect x="466" y="120" width="12" height="60" fill="#FFFFFF"/>
    <rect x="464" y="118" width="16" height="64" fill="#FFFFFF" opacity="0.15"/>
  </g>

  <!-- Ball trail (motion blur showing left-to-right diagonal-up path) -->
  <g fill="#FFFFFF">
    <rect x="180" y="170" width="10" height="10" opacity="0.10"/>
    <rect x="218" y="160" width="10" height="10" opacity="0.18"/>
    <rect x="256" y="150" width="10" height="10" opacity="0.30"/>
    <rect x="294" y="140" width="10" height="10" opacity="0.50"/>
    <rect x="332" y="130" width="10" height="10" opacity="0.75"/>
    <!-- Ball -->
    <rect x="370" y="120" width="12" height="12"/>
  </g>
  <!-- Ball glow halo -->
  <circle cx="376" cy="126" r="14" fill="url(#pongGlow)" opacity="0.6"/>

  <!-- HUD top-center: PONG title -->
  <g transform="translate(256, 16)">
    <text x="0" y="0" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="11" fill="#22C55E" letter-spacing="3">PONG</text>
  </g>

  <!-- HUD bottom info -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#FFFFFF" opacity="0.5">
    <text x="32" y="250">ROUND 03</text>
    <text x="480" y="250" text-anchor="end">FIRST TO 11</text>
  </g>
</svg>
