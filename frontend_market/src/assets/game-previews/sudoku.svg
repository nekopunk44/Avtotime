<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-label="Sudoku preview">
  <defs>
    <linearGradient id="suBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E0E7FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="256" rx="28" fill="url(#suBg)"/>

  <!-- === Sudoku board (9x9, cell 22) at (157, 28) === -->
  <rect x="157" y="28" width="198" height="198" fill="white"/>

  <!-- Active row highlight (row 4) -->
  <rect x="157" y="116" width="198" height="22" fill="#DBEAFE"/>
  <!-- Active column highlight (col 2) -->
  <rect x="201" y="28" width="22" height="198" fill="#DBEAFE"/>
  <!-- Active 3x3 box highlight (cols 0-2, rows 3-5) -->
  <rect x="157" y="94" width="66" height="66" fill="#BFDBFE" opacity="0.55"/>
  <!-- Active cell -->
  <rect x="201" y="116" width="22" height="22" fill="#FEF08A"/>

  <!-- Thin cell lines -->
  <g stroke="#CBD5E1" stroke-width="1">
    <line x1="179" y1="28" x2="179" y2="226"/>
    <line x1="201" y1="28" x2="201" y2="226"/>
    <line x1="245" y1="28" x2="245" y2="226"/>
    <line x1="267" y1="28" x2="267" y2="226"/>
    <line x1="311" y1="28" x2="311" y2="226"/>
    <line x1="333" y1="28" x2="333" y2="226"/>
    <line x1="157" y1="50"  x2="355" y2="50"/>
    <line x1="157" y1="72"  x2="355" y2="72"/>
    <line x1="157" y1="116" x2="355" y2="116"/>
    <line x1="157" y1="138" x2="355" y2="138"/>
    <line x1="157" y1="182" x2="355" y2="182"/>
    <line x1="157" y1="204" x2="355" y2="204"/>
  </g>

  <!-- Thick 3x3 box dividers -->
  <g stroke="#1E293B" stroke-width="2">
    <line x1="223" y1="28" x2="223" y2="226"/>
    <line x1="289" y1="28" x2="289" y2="226"/>
    <line x1="157" y1="94"  x2="355" y2="94"/>
    <line x1="157" y1="160" x2="355" y2="160"/>
  </g>

  <!-- Outer board border -->
  <rect x="157" y="28" width="198" height="198" fill="none" stroke="#0F172A" stroke-width="3"/>

  <!-- === Numbers === -->
  <!-- Givens in dark, user input on active cell in blue -->
  <g font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle" fill="#0F172A">
    <!-- Row 0 (y=44) -->
    <text x="168" y="44">5</text>
    <text x="256" y="44">7</text>
    <text x="300" y="44">2</text>
    <!-- Row 1 (y=66) -->
    <text x="190" y="66">6</text>
    <text x="234" y="66">1</text>
    <text x="256" y="66">9</text>
    <text x="278" y="66">5</text>
    <!-- Row 2 (y=88) -->
    <text x="212" y="88">8</text>
    <text x="322" y="88">6</text>
    <!-- Row 3 (y=110) -->
    <text x="168" y="110">8</text>
    <text x="256" y="110">6</text>
    <text x="344" y="110">3</text>
    <!-- Row 4 (y=132) - ACTIVE ROW -->
    <text x="168" y="132">4</text>
    <text x="190" y="132">9</text>
    <text x="234" y="132">8</text>
    <text x="278" y="132">3</text>
    <text x="344" y="132">1</text>
    <!-- Row 5 (y=154) -->
    <text x="168" y="154">7</text>
    <text x="256" y="154">2</text>
    <text x="344" y="154">6</text>
    <!-- Row 6 (y=176) -->
    <text x="190" y="176">6</text>
    <text x="300" y="176">2</text>
    <text x="322" y="176">8</text>
    <!-- Row 7 (y=198) -->
    <text x="234" y="198">4</text>
    <text x="256" y="198">1</text>
    <text x="278" y="198">9</text>
    <text x="344" y="198">5</text>
    <!-- Row 8 (y=220) -->
    <text x="256" y="220">8</text>
    <text x="322" y="220">7</text>
    <text x="344" y="220">9</text>
  </g>

  <!-- User input number on active cell (blue) -->
  <text x="212" y="132" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#2563EB">3</text>

  <!-- === Number pad (right side) === -->
  <g transform="translate(382, 64)">
    <rect x="0" y="0" width="100" height="124" rx="10" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="50" y="16" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#64748B">ВВЕСТИ</text>
    <g font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">
      <!-- row 1: 1 2 3 -->
      <rect x="6"  y="24" width="28" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="20" y="42" fill="#1E293B">1</text>
      <rect x="36" y="24" width="28" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="50" y="42" fill="#1E293B">2</text>
      <rect x="66" y="24" width="28" height="28" rx="4" fill="#2563EB" stroke="#1E40AF"/>
      <text x="80" y="42" fill="white">3</text>
      <!-- row 2: 4 5 6 -->
      <rect x="6"  y="56" width="28" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="20" y="74" fill="#1E293B">4</text>
      <rect x="36" y="56" width="28" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="50" y="74" fill="#1E293B">5</text>
      <rect x="66" y="56" width="28" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="80" y="74" fill="#1E293B">6</text>
      <!-- row 3: 7 8 9 -->
      <rect x="6"  y="88" width="28" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="20" y="106" fill="#1E293B">7</text>
      <rect x="36" y="88" width="28" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="50" y="106" fill="#1E293B">8</text>
      <rect x="66" y="88" width="28" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
      <text x="80" y="106" fill="#1E293B">9</text>
    </g>
  </g>

  <!-- Timer (top-left) -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="100" height="32" rx="16" fill="white" stroke="#94A3B8" stroke-width="2"/>
    <text x="14" y="21" font-family="sans-serif" font-weight="bold" font-size="13" fill="#64748B">⏱</text>
    <text x="58" y="21" text-anchor="middle" font-family="monospace" font-weight="900" font-size="14" fill="#1E293B">05:42</text>
  </g>

  <!-- Difficulty -->
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="50" y="19" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#92400E">Средний</text>
  </g>
</svg>
