<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-label="Snake preview">
  <defs>
    <linearGradient id="snBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#BBF7D0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CFFAFE" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="snField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#ECFCCB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="256" rx="28" fill="url(#snBg)"/>

  <!-- Game field -->
  <rect x="38" y="44" width="436" height="196" rx="10" fill="url(#snField)" stroke="#86EFAC" stroke-width="2"/>

  <!-- Grid lines -->
  <g stroke="#86EFAC" stroke-width="0.5" opacity="0.6">
    <line x1="64"  y1="44" x2="64"  y2="240"/>
    <line x1="88"  y1="44" x2="88"  y2="240"/>
    <line x1="112" y1="44" x2="112" y2="240"/>
    <line x1="136" y1="44" x2="136" y2="240"/>
    <line x1="160" y1="44" x2="160" y2="240"/>
    <line x1="184" y1="44" x2="184" y2="240"/>
    <line x1="208" y1="44" x2="208" y2="240"/>
    <line x1="232" y1="44" x2="232" y2="240"/>
    <line x1="256" y1="44" x2="256" y2="240"/>
    <line x1="280" y1="44" x2="280" y2="240"/>
    <line x1="304" y1="44" x2="304" y2="240"/>
    <line x1="328" y1="44" x2="328" y2="240"/>
    <line x1="352" y1="44" x2="352" y2="240"/>
    <line x1="376" y1="44" x2="376" y2="240"/>
    <line x1="400" y1="44" x2="400" y2="240"/>
    <line x1="424" y1="44" x2="424" y2="240"/>
    <line x1="448" y1="44" x2="448" y2="240"/>
    <line x1="38"  y1="68"  x2="474" y2="68"/>
    <line x1="38"  y1="92"  x2="474" y2="92"/>
    <line x1="38"  y1="116" x2="474" y2="116"/>
    <line x1="38"  y1="140" x2="474" y2="140"/>
    <line x1="38"  y1="164" x2="474" y2="164"/>
    <line x1="38"  y1="188" x2="474" y2="188"/>
    <line x1="38"  y1="212" x2="474" y2="212"/>
  </g>

  <!-- === Snake body (S-shape winding through field) === -->
  <g fill="#22C55E" stroke="#15803D" stroke-width="1.5">
    <!-- tail -->
    <rect x="90"  y="96"  width="20" height="20" rx="6"/>
    <rect x="114" y="96"  width="20" height="20" rx="6"/>
    <rect x="138" y="96"  width="20" height="20" rx="6"/>
    <!-- bend down -->
    <rect x="138" y="120" width="20" height="20" rx="6"/>
    <rect x="138" y="144" width="20" height="20" rx="6"/>
    <rect x="138" y="168" width="20" height="20" rx="6"/>
    <!-- straight right along bottom -->
    <rect x="162" y="168" width="20" height="20" rx="6"/>
    <rect x="186" y="168" width="20" height="20" rx="6"/>
    <rect x="210" y="168" width="20" height="20" rx="6"/>
    <rect x="234" y="168" width="20" height="20" rx="6"/>
    <!-- bend up -->
    <rect x="234" y="144" width="20" height="20" rx="6"/>
    <rect x="234" y="120" width="20" height="20" rx="6"/>
    <rect x="234" y="96"  width="20" height="20" rx="6"/>
    <!-- straight right along top -->
    <rect x="258" y="96"  width="20" height="20" rx="6"/>
    <rect x="282" y="96"  width="20" height="20" rx="6"/>
    <rect x="306" y="96"  width="20" height="20" rx="6"/>
    <rect x="330" y="96"  width="20" height="20" rx="6"/>
  </g>

  <!-- Snake head (slightly darker, facing right) -->
  <g>
    <rect x="354" y="96" width="20" height="20" rx="6" fill="#16A34A" stroke="#14532D" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="368" cy="101" r="2.5" fill="white"/>
    <circle cx="368" cy="111" r="2.5" fill="white"/>
    <circle cx="369" cy="101" r="1.4" fill="#0F172A"/>
    <circle cx="369" cy="111" r="1.4" fill="#0F172A"/>
    <!-- Forked tongue -->
    <path d="M 376,106 L 384,103 M 376,106 L 384,109" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- === Apple ahead of head === -->
  <g transform="translate(436, 106)">
    <ellipse cx="0" cy="3" rx="10" ry="9" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.5"/>
    <ellipse cx="-3" cy="-1" rx="3" ry="2" fill="#FCA5A5" opacity="0.8"/>
    <!-- stem -->
    <path d="M 0,-6 Q 2,-9 4,-9" stroke="#78350F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- leaf -->
    <path d="M 4,-9 Q 9,-11 11,-7 Q 7,-6 4,-9 Z" fill="#22C55E" stroke="#15803D" stroke-width="1"/>
  </g>

  <!-- === Score badge top-left === -->
  <g transform="translate(28, 12)">
    <rect x="0" y="0" width="108" height="28" rx="14" fill="white" stroke="#22C55E" stroke-width="2"/>
    <text x="14" y="19" font-family="sans-serif" font-weight="bold" font-size="13" fill="#166534">Счёт:</text>
    <text x="66" y="19" font-family="sans-serif" font-weight="900" font-size="14" fill="#22C55E">170</text>
  </g>

  <!-- === Best badge top-right === -->
  <g transform="translate(376, 12)">
    <rect x="0" y="0" width="108" height="28" rx="14" fill="white" stroke="#F59E0B" stroke-width="2"/>
    <text x="14" y="19" font-family="sans-serif" font-weight="bold" font-size="13" fill="#92400E">Рекорд:</text>
    <text x="76" y="19" font-family="sans-serif" font-weight="900" font-size="14" fill="#F59E0B">240</text>
  </g>
</svg>
