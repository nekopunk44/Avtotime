<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-label="Minesweeper preview">
  <defs>
    <linearGradient id="ms2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FEE2E2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="256" rx="28" fill="url(#ms2Bg)"/>

  <!-- ==== Win95-style outer game frame ==== -->
  <rect x="36" y="20" width="440" height="216" rx="6" fill="#C0C0C0"/>
  <!-- 3D outer bevel -->
  <path d="M 36,20 L 476,20 L 476,24 L 40,24 L 40,232 L 36,232 Z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M 476,20 L 476,236 L 36,236 L 36,232 L 472,232 L 472,24 Z" fill="#7F7F7F"/>

  <!-- ==== Top bar (recessed) ==== -->
  <rect x="52" y="34" width="408" height="44" fill="#C0C0C0"/>
  <path d="M 52,34 L 460,34 L 460,36 L 54,36 L 54,78 L 52,78 Z" fill="#7F7F7F"/>
  <path d="M 460,34 L 460,78 L 52,78 L 52,76 L 458,76 L 458,36 Z" fill="#FFFFFF"/>

  <!-- Mine counter (left) -->
  <g>
    <rect x="68" y="42" width="68" height="28" fill="#000"/>
    <rect x="70" y="44" width="64" height="24" fill="#1F1F1F"/>
    <text x="102" y="64" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="22" fill="#EF4444" letter-spacing="2">023</text>
  </g>

  <!-- Smiley face (center) -->
  <g transform="translate(240, 38)">
    <!-- recessed border (button) -->
    <rect x="0" y="0" width="36" height="36" fill="#C0C0C0"/>
    <path d="M 0,0 L 36,0 L 36,3 L 3,3 L 3,36 L 0,36 Z" fill="#FFFFFF"/>
    <path d="M 36,0 L 36,36 L 0,36 L 0,33 L 33,33 L 33,3 Z" fill="#7F7F7F"/>
    <!-- smiley -->
    <circle cx="18" cy="18" r="12" fill="#FACC15" stroke="#A16207" stroke-width="1.5"/>
    <circle cx="14" cy="15" r="1.6" fill="#0F172A"/>
    <circle cx="22" cy="15" r="1.6" fill="#0F172A"/>
    <path d="M 12,21 Q 18,25 24,21" fill="none" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Timer (right) -->
  <g>
    <rect x="376" y="42" width="68" height="28" fill="#000"/>
    <rect x="378" y="44" width="64" height="24" fill="#1F1F1F"/>
    <text x="410" y="64" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="22" fill="#EF4444" letter-spacing="2">128</text>
  </g>

  <!-- ==== Board frame (recessed) ==== -->
  <rect x="52" y="88" width="408" height="140" fill="#C0C0C0"/>
  <path d="M 52,88 L 460,88 L 460,91 L 55,91 L 55,228 L 52,228 Z" fill="#7F7F7F"/>
  <path d="M 460,88 L 460,228 L 52,228 L 52,225 L 457,225 L 457,91 Z" fill="#FFFFFF"/>

  <!-- ==== Cells: 17 × 6 grid (cell=22), x=58..432, y=94..226 ==== -->
  <!-- Helper convention:
       closed = grey raised cell
       opened = flat grey with number
       flag   = closed + red flag
       mine   = red bg + black mine -->

  <!-- Generate cells programmatically would be ideal, but inline for SVG. -->
  <!-- Use defs for reusable shapes -->
  <defs>
    <symbol id="msClosedC" viewBox="0 0 22 22">
      <rect width="22" height="22" fill="#C0C0C0"/>
      <path d="M 0,0 L 22,0 L 22,3 L 3,3 L 3,22 L 0,22 Z" fill="#FFFFFF"/>
      <path d="M 22,0 L 22,22 L 0,22 L 0,19 L 19,19 L 19,3 Z" fill="#7F7F7F"/>
    </symbol>
    <symbol id="msOpenC" viewBox="0 0 22 22">
