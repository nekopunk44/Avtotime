<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-label="2048 preview">
  <defs>
    <linearGradient id="g2048Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FAF8EF"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="256" rx="28" fill="url(#g2048Bg)"/>

  <!-- === Left side: score boxes === -->
  <g transform="translate(28, 28)">
    <!-- SCORE -->
    <rect x="0" y="0" width="108" height="64" rx="10" fill="#BBADA0"/>
    <text x="54" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="11" fill="#EEE4DA">SCORE</text>
    <text x="54" y="50" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="white">12 480</text>
    <!-- BEST -->
    <rect x="0" y="76" width="108" height="64" rx="10" fill="#BBADA0"/>
    <text x="54" y="98" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="11" fill="#EEE4DA">BEST</text>
    <text x="54" y="126" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="white">24 960</text>
    <!-- Logo -->
    <text x="54" y="170" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="32" fill="#776E65">2048</text>
  </g>

  <!-- === Game board === -->
  <g transform="translate(156, 28)">
    <rect x="0" y="0" width="200" height="200" rx="10" fill="#BBADA0"/>

    <!-- Empty cell base layer -->
    <g fill="#CDC1B4">
      <rect x="8"   y="8"   width="44" height="44" rx="6"/>
      <rect x="56"  y="8"   width="44" height="44" rx="6"/>
      <rect x="104" y="8"   width="44" height="44" rx="6"/>
      <rect x="152" y="8"   width="44" height="44" rx="6"/>
      <rect x="8"   y="56"  width="44" height="44" rx="6"/>
      <rect x="56"  y="56"  width="44" height="44" rx="6"/>
      <rect x="104" y="56"  width="44" height="44" rx="6"/>
      <rect x="152" y="56"  width="44" height="44" rx="6"/>
      <rect x="8"   y="104" width="44" height="44" rx="6"/>
      <rect x="56"  y="104" width="44" height="44" rx="6"/>
      <rect x="104" y="104" width="44" height="44" rx="6"/>
      <rect x="152" y="104" width="44" height="44" rx="6"/>
      <rect x="8"   y="152" width="44" height="44" rx="6"/>
      <rect x="56"  y="152" width="44" height="44" rx="6"/>
      <rect x="104" y="152" width="44" height="44" rx="6"/>
      <rect x="152" y="152" width="44" height="44" rx="6"/>
    </g>

    <!-- === Tiles (game state) === -->
    <!-- Row 0: _, _, 2, 4 -->
    <g>
      <rect x="104" y="8" width="44" height="44" rx="6" fill="#EEE4DA"/>
      <text x="126" y="38" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#776E65">2</text>
      <rect x="152" y="8" width="44" height="44" rx="6" fill="#EDE0C8"/>
      <text x="174" y="38" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#776E65">4</text>
    </g>
    <!-- Row 1: 4, _, 8, 32 -->
    <g>
      <rect x="8"   y="56" width="44" height="44" rx="6" fill="#EDE0C8"/>
      <text x="30"  y="86" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#776E65">4</text>
      <rect x="104" y="56" width="44" height="44" rx="6" fill="#F2B179"/>
      <text x="126" y="86" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#F9F6F2">8</text>
      <rect x="152" y="56" width="44" height="44" rx="6" fill="#F67C5F"/>
      <text x="174" y="86" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="20" fill="#F9F6F2">32</text>
    </g>
    <!-- Row 2: 16, 8, 64, 16 -->
    <g>
      <rect x="8"   y="104" width="44" height="44" rx="6" fill="#F59563"/>
      <text x="30"  y="134" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="20" fill="#F9F6F2">16</text>
      <rect x="56"  y="104" width="44" height="44" rx="6" fill="#F2B179"/>
      <text x="78"  y="134" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#F9F6F2">8</text>
      <rect x="104" y="104" width="44" height="44" rx="6" fill="#F65E3B"/>
      <text x="126" y="134" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="20" fill="#F9F6F2">64</text>
      <rect x="152" y="104" width="44" height="44" rx="6" fill="#F59563"/>
      <text x="174" y="134" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="20" fill="#F9F6F2">16</text>
    </g>
    <!-- Row 3: 128, 256, 512, 4 -->
    <g>
      <rect x="8"   y="152" width="44" height="44" rx="6" fill="#EDCF72"/>
      <text x="30"  y="182" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#F9F6F2">128</text>
      <rect x="56"  y="152" width="44" height="44" rx="6" fill="#EDCC61"/>
      <text x="78"  y="182" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#F9F6F2">256</text>
      <rect x="104" y="152" width="44" height="44" rx="6" fill="#EDC850"/>
      <text x="126" y="182" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#F9F6F2">512</text>
      <rect x="152" y="152" width="44" height="44" rx="6" fill="#EDE0C8"/>
      <text x="174" y="182" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#776E65">4</text>
    </g>
  </g>

  <!-- === Right side: directional hint === -->
  <g transform="translate(384, 60)">
    <text x="50" y="0" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#776E65">УПРАВЛЕНИЕ</text>
    <!-- Up arrow key -->
    <rect x="34" y="10"  width="32" height="32" rx="6" fill="#BBADA0"/>
    <path d="M 50,18 L 58,30 L 42,30 Z" fill="#F9F6F2"/>
    <!-- Left arrow -->
    <rect x="0"  y="48" width="32" height="32" rx="6" fill="#BBADA0"/>
    <path d="M 8,64 L 20,56 L 20,72 Z" fill="#F9F6F2"/>
    <!-- Down arrow (highlighted - last move) -->
    <rect x="34" y="48" width="32" height="32" rx="6" fill="#F67C5F"/>
    <path d="M 50,72 L 42,60 L 58,60 Z" fill="white"/>
    <!-- Right arrow -->
    <rect x="68" y="48" width="32" height="32" rx="6" fill="#BBADA0"/>
    <path d="M 92,64 L 80,56 L 80,72 Z" fill="#F9F6F2"/>
    <!-- Last move label -->
    <text x="50" y="100" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#776E65">↓ ВНИЗ</text>
  </g>
</svg>
