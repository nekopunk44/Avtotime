<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-label="Circuit Rush 3D preview">
  <defs>
    <linearGradient id="crSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#312E81"/>
      <stop offset="55%"  stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="crGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="crRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#475569"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="crCar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <clipPath id="crFrame">
      <rect width="512" height="256" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#crFrame)">
    <!-- Sky -->
    <rect width="512" height="135" fill="url(#crSky)"/>

    <!-- Sun on horizon -->
    <ellipse cx="256" cy="135" rx="48" ry="26" fill="#FEF3C7" opacity="0.95"/>
    <ellipse cx="256" cy="135" rx="36" ry="18" fill="#FFFBEB"/>
    <!-- Horizontal sun bands (classic synth-wave look) -->
    <g stroke="#312E81" stroke-width="2" opacity="0.9">
      <line x1="220" y1="125" x2="292" y2="125"/>
      <line x1="216" y1="118" x2="296" y2="118"/>
    </g>

    <!-- Mountain silhouettes -->
    <path d="M 0,135 L 50,104 L 100,124 L 160,94 L 220,118 L 256,110 L 290,118 L 360,92 L 420,114 L 470,100 L 512,128 L 512,138 L 0,138 Z"
          fill="#1E1B4B" opacity="0.85"/>

    <!-- Ground -->
    <rect x="0" y="135" width="512" height="121" fill="url(#crGround)"/>

    <!-- Synth-wave grid on the ground (horizontal lines getting closer) -->
    <g stroke="#7C3AED" stroke-width="1" opacity="0.45">
      <line x1="0" y1="142" x2="512" y2="142"/>
      <line x1="0" y1="152" x2="512" y2="152"/>
      <line x1="0" y1="166" x2="512" y2="166"/>
      <line x1="0" y1="186" x2="512" y2="186"/>
      <line x1="0" y1="214" x2="512" y2="214"/>
      <line x1="0" y1="248" x2="512" y2="248"/>
    </g>
    <!-- Vertical perspective lines (converging to horizon center) -->
    <g stroke="#7C3AED" stroke-width="1" opacity="0.4">
      <line x1="256" y1="135" x2="-40"  y2="256"/>
      <line x1="256" y1="135" x2="80"   y2="256"/>
      <line x1="256" y1="135" x2="180"  y2="256"/>
      <line x1="256" y1="135" x2="332"  y2="256"/>
      <line x1="256" y1="135" x2="432"  y2="256"/>
      <line x1="256" y1="135" x2="552"  y2="256"/>
    </g>

    <!-- Road in perspective (trapezoid converging to horizon) -->
    <polygon points="232,135 280,135 484,256 28,256" fill="url(#crRoad)"/>

    <!-- Road edge — white base under red stripes -->
    <polygon points="220,135 232,135 28,256 6,256"  fill="white"/>
    <polygon points="280,135 292,135 506,256 484,256" fill="white"/>

    <!-- Red curb stripes (alternating along edges) -->
    <g fill="#EF4444">
      <polygon points="220,138 229,138 226,148 217,148"/>
      <polygon points="216,158 227,158 222,170 211,170"/>
      <polygon points="210,180 224,180 217,196 203,196"/>
      <polygon points="202,206 220,206 211,226 193,226"/>
      <polygon points="190,234 216,234 204,256 178,256"/>

      <polygon points="283,138 292,138 295,148 286,148"/>
      <polygon points="285,158 296,158 301,170 290,170"/>
      <polygon points="288,180 302,180 309,196 295,196"/>
      <polygon points="292,206 310,206 321,226 303,226"/>
      <polygon points="296,234 322,234 334,256 308,256"/>
    </g>

    <!-- Center lane dashes (perspective) -->
    <g fill="#FACC15">
      <polygon points="254,140 258,140 259,146 253,146"/>
      <polygon points="252,156 260,156 262,166 250,166"/>
      <polygon points="248,180 264,180 267,196 245,196"/>
      <polygon points="242,210 270,210 275,232 237,232"/>
    </g>

    <!-- Car (rear 3/4 view in foreground) -->
    <g transform="translate(216, 158)">
      <!-- Shadow -->
      <ellipse cx="40" cy="86" rx="46" ry="6" fill="black" opacity="0.55"/>
      <!-- Body -->
      <path d="M 4,82
               L 0,52
               Q 0,40 12,38
               L 30,32
               L 36,22
               L 44,22
               L 50,32
               L 68,38
               Q 80,40 80,52
               L 76,82 Z"
            fill="url(#crCar)" stroke="#7F1D1D" stroke-width="2" stroke-linejoin="round"/>
      <!-- Rear window / roof -->
      <path d="M 18,38 L 30,34 L 36,24 L 44,24 L 50,34 L 62,38 L 58,50 L 22,50 Z"
            fill="#1E40AF" opacity="0.9"/>
      <!-- Brake lights -->
      <rect x="6"  y="58" width="14" height="6" rx="2" fill="#FCA5A5"/>
      <rect x="60" y="58" width="14" height="6" rx="2" fill="#FCA5A5"/>
      <!-- License plate -->
      <rect x="30" y="68" width="20" height="6" rx="1" fill="#F9FAFB"/>
      <!-- Wheels (rear, partly visible) -->
      <ellipse cx="6"  cy="80" rx="9" ry="6" fill="#0F172A"/>
      <ellipse cx="74" cy="80" rx="9" ry="6" fill="#0F172A"/>
      <!-- Exhaust puffs -->
      <circle cx="20" cy="86" r="6" fill="white" opacity="0.5"/>
      <circle cx="60" cy="86" r="6" fill="white" opacity="0.5"/>
    </g>

    <!-- Speed lines on sides -->
    <g stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <line x1="22"  y1="170" x2="60"  y2="174"/>
      <line x1="16"  y1="198" x2="58"  y2="202"/>
      <line x1="10"  y1="226" x2="54"  y2="232"/>
      <line x1="490" y1="170" x2="452" y2="174"/>
      <line x1="496" y1="198" x2="454" y2="202"/>
      <line x1="502" y1="226" x2="458" y2="232"/>
    </g>

    <!-- 3D badge -->
    <g transform="translate(442, 20)">
      <rect x="0" y="0" width="48" height="28" rx="14" fill="#FBBF24" stroke="#92400E" stroke-width="2"/>
      <text x="24" y="20" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#7C2D12">3D</text>
    </g>
  </g>
</svg>
