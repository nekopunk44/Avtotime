<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-label="Checkers preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f1f5f9" />
    </linearGradient>

    <pattern id="board" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="#cbd5e1" />
      <rect x="20" y="20" width="20" height="20" fill="#cbd5e1" />
      <rect x="20" y="0" width="20" height="20" fill="#94a3b8" />
      <rect x="0" y="20" width="20" height="20" fill="#94a3b8" />
    </pattern>

    <radialGradient id="pieceRed" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fb7185" />
      <stop offset="1" stop-color="#ef4444" />
    </radialGradient>

    <radialGradient id="pieceBlack" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#334155" />
      <stop offset="1" stop-color="#0f172a" />
    </radialGradient>

    <clipPath id="boardClip">
      <rect x="28" y="28" width="456" height="200" rx="30" />
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="256" rx="48" fill="url(#bg)" />
  <rect x="14" y="14" width="484" height="228" rx="44" fill="#0f172a" opacity="0.05" />

  <g clip-path="url(#boardClip)">
    <rect x="28" y="28" width="456" height="200" fill="url(#board)" opacity="0.95" />
    <rect x="28" y="28" width="456" height="200" fill="#0f172a" opacity="0.06" />
  </g>

  <!-- Pieces -->
  <g opacity="0.98">
    <ellipse cx="220" cy="148" rx="30" ry="9" fill="#0f172a" opacity="0.14" />
    <ellipse cx="356" cy="168" rx="30" ry="9" fill="#0f172a" opacity="0.14" />

    <circle cx="220" cy="132" r="30" fill="url(#pieceRed)" />
    <circle cx="220" cy="132" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="5" />
    <path d="M220 116l7 9h11l-9 7 5 11-14-8-14 8 5-11-9-7h11z" fill="#ffffff" opacity="0.92" />

    <circle cx="356" cy="154" r="30" fill="url(#pieceBlack)" />
    <circle cx="356" cy="154" r="20" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5" />
  </g>

  <rect x="28" y="28" width="456" height="200" rx="30" fill="none" stroke="#0f172a" stroke-opacity="0.10" stroke-width="6" />
</svg>
