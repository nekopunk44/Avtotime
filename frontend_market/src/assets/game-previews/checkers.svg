<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-label="Checkers preview">
  <defs>
    <linearGradient id="chkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FEF3C7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FECACA" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="chkRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#FCA5A5"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>
    <radialGradient id="chkDark" cx="35%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#4B5563"/>
      <stop offset="60%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="256" rx="28" fill="url(#chkBg)"/>

  <!-- Wooden frame -->
  <rect x="164" y="36" width="184" height="184" rx="6" fill="#78350F"/>
  <rect x="168" y="40" width="176" height="176" fill="#F0D9B5"/>

  <!-- Dark squares (col+row odd) -->
  <g fill="#8B4513">
    <!-- row 0 -->
    <rect x="190" y="40"  width="22" height="22"/>
    <rect x="234" y="40"  width="22" height="22"/>
    <rect x="278" y="40"  width="22" height="22"/>
    <rect x="322" y="40"  width="22" height="22"/>
    <!-- row 1 -->
    <rect x="168" y="62"  width="22" height="22"/>
    <rect x="212" y="62"  width="22" height="22"/>
    <rect x="256" y="62"  width="22" height="22"/>
    <rect x="300" y="62"  width="22" height="22"/>
    <!-- row 2 -->
    <rect x="190" y="84"  width="22" height="22"/>
    <rect x="234" y="84"  width="22" height="22"/>
    <rect x="278" y="84"  width="22" height="22"/>
    <rect x="322" y="84"  width="22" height="22"/>
    <!-- row 3 -->
    <rect x="168" y="106" width="22" height="22"/>
    <rect x="212" y="106" width="22" height="22"/>
    <rect x="256" y="106" width="22" height="22"/>
    <rect x="300" y="106" width="22" height="22"/>
    <!-- row 4 -->
    <rect x="190" y="128" width="22" height="22"/>
    <rect x="234" y="128" width="22" height="22"/>
    <rect x="278" y="128" width="22" height="22"/>
    <rect x="322" y="128" width="22" height="22"/>
    <!-- row 5 -->
    <rect x="168" y="150" width="22" height="22"/>
    <rect x="212" y="150" width="22" height="22"/>
    <rect x="256" y="150" width="22" height="22"/>
    <rect x="300" y="150" width="22" height="22"/>
    <!-- row 6 -->
    <rect x="190" y="172" width="22" height="22"/>
    <rect x="234" y="172" width="22" height="22"/>
    <rect x="278" y="172" width="22" height="22"/>
    <rect x="322" y="172" width="22" height="22"/>
    <!-- row 7 -->
    <rect x="168" y="194" width="22" height="22"/>
    <rect x="212" y="194" width="22" height="22"/>
    <rect x="256" y="194" width="22" height="22"/>
    <rect x="300" y="194" width="22" height="22"/>
  </g>

  <!-- Last move highlight -->
  <rect x="234" y="128" width="22" height="22" fill="#FACC15" opacity="0.55"/>
  <rect x="256" y="150" width="22" height="22" fill="#FACC15" opacity="0.55"/>

  <!-- Selected piece highlight (with possible move dot) -->
  <circle cx="289" cy="139" r="3" fill="#22C55E" opacity="0.85"/>
  <circle cx="311" cy="161" r="3" fill="#22C55E" opacity="0.85"/>

  <!-- ============== PIECES ============== -->
  <!-- Black pieces (top) -->
  <!-- row 0: 4 pieces full row at (190..344) -->
  <g>
    <ellipse cx="201" cy="55" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="201" cy="51" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="201" cy="51" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="245" cy="55" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="245" cy="51" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="245" cy="51" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="289" cy="55" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="289" cy="51" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="289" cy="51" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="333" cy="55" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="333" cy="51" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="333" cy="51" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>

  <!-- row 1: 3 pieces at (179, 223, 311) — (267 lost) -->
  <g>
    <ellipse cx="179" cy="77" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="179" cy="73" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="179" cy="73" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="223" cy="77" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="223" cy="73" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="223" cy="73" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="311" cy="77" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="311" cy="73" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="311" cy="73" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>

  <!-- row 2: 2 pieces advanced at (245, 333) -->
  <g>
    <ellipse cx="245" cy="99" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="245" cy="95" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="245" cy="95" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="333" cy="99" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="333" cy="95" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="333" cy="95" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>

  <!-- row 4: black piece advanced at (245, 139) -->
  <g>
    <ellipse cx="245" cy="143" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="245" cy="139" r="9" fill="url(#chkDark)" stroke="#000" stroke-width="1"/>
    <circle cx="245" cy="139" r="6" fill="none" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.2"/>
  </g>

  <!-- Red pieces (bottom) -->
  <!-- row 5: 2 pieces at (179, 311) -->
  <g>
    <ellipse cx="179" cy="165" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="179" cy="161" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="179" cy="161" r="6" fill="none" stroke="#FFF" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="311" cy="165" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="311" cy="161" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="311" cy="161" r="6" fill="none" stroke="#FFF" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>

  <!-- row 6: 3 pieces at (201, 289, 333) -->
  <g>
    <ellipse cx="201" cy="187" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="201" cy="183" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="201" cy="183" r="6" fill="none" stroke="#FFF" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="289" cy="187" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="289" cy="183" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="289" cy="183" r="6" fill="none" stroke="#FFF" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="333" cy="187" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="333" cy="183" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="333" cy="183" r="6" fill="none" stroke="#FFF" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>

  <!-- row 7: 3 pieces at (179, 223, 267) — last one is a KING -->
  <g>
    <ellipse cx="179" cy="209" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="179" cy="205" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="179" cy="205" r="6" fill="none" stroke="#FFF" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>
  <g>
    <ellipse cx="223" cy="209" rx="9" ry="3" fill="#000" opacity="0.3"/>
    <circle cx="223" cy="205" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="223" cy="205" r="6" fill="none" stroke="#FFF" stroke-opacity="0.25" stroke-width="1.2"/>
  </g>

  <!-- Red KING at row 3 (advanced, crowned) -->
  <g>
    <ellipse cx="267" cy="121" rx="10" ry="3.5" fill="#000" opacity="0.35"/>
    <!-- stacked two pieces -->
    <circle cx="267" cy="119" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <circle cx="267" cy="115" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <!-- crown -->
    <path d="M 261,113 L 263,109 L 265,112 L 267,108 L 269,112 L 271,109 L 273,113 L 273,116 L 261,116 Z"
          fill="#FACC15" stroke="#A16207" stroke-width="0.8"/>
    <circle cx="267" cy="114" r="1.2" fill="#DC2626"/>
  </g>

  <!-- ============== SIDE PANELS ============== -->
  <!-- Captured pieces (left) -->
  <g transform="translate(28, 40)">
    <rect width="120" height="80" rx="10" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="10" y="16" font-family="sans-serif" font-weight="bold" font-size="10" fill="#64748B">ВЗЯТЫЕ</text>
    <!-- red eats black -->
    <text x="10" y="34" font-family="sans-serif" font-weight="bold" font-size="9" fill="#DC2626">КРАСНЫЕ:</text>
    <g>
      <circle cx="62" cy="32" r="6" fill="url(#chkDark)" stroke="#000" stroke-width="0.8"/>
      <circle cx="74" cy="32" r="6" fill="url(#chkDark)" stroke="#000" stroke-width="0.8"/>
      <circle cx="86" cy="32" r="6" fill="url(#chkDark)" stroke="#000" stroke-width="0.8"/>
      <circle cx="98" cy="32" r="6" fill="url(#chkDark)" stroke="#000" stroke-width="0.8"/>
    </g>
    <text x="10" y="58" font-family="sans-serif" font-weight="bold" font-size="9" fill="#0F172A">ЧЁРНЫЕ:</text>
    <g>
      <circle cx="62" cy="56" r="6" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="0.8"/>
      <circle cx="74" cy="56" r="6" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="0.8"/>
      <circle cx="86" cy="56" r="6" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Turn + status (right) -->
  <g transform="translate(364, 40)">
    <rect width="120" height="32" rx="16" fill="white" stroke="#1F2937" stroke-width="2"/>
    <circle cx="20" cy="16" r="9" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="1"/>
    <text x="68" y="20" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1F2937">Ход красных</text>
  </g>

  <!-- Score / piece count -->
  <g transform="translate(364, 84)">
    <rect width="120" height="60" rx="10" fill="white" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="10" y="18" font-family="sans-serif" font-weight="bold" font-size="10" fill="#64748B">ШАШКИ</text>
    <g font-family="sans-serif" font-weight="bold" font-size="12" fill="#0F172A">
      <circle cx="16" cy="34" r="6" fill="url(#chkRed)" stroke="#7F1D1D" stroke-width="0.8"/>
      <text x="30" y="38" fill="#DC2626">8 (1 ♛)</text>
      <circle cx="16" cy="50" r="6" fill="url(#chkDark)" stroke="#000" stroke-width="0.8"/>
      <text x="30" y="54" fill="#0F172A">10</text>
    </g>
  </g>

  <!-- Timer -->
  <g transform="translate(364, 156)">
    <rect width="120" height="32" rx="10" fill="#1F2937"/>
    <text x="10" y="14" font-family="sans-serif" font-weight="bold" font-size="9" fill="#94A3B8">ВРЕМЯ</text>
    <text x="60" y="26" text-anchor="middle" font-family="monospace" font-weight="900" font-size="13" fill="#FACC15">08:14</text>
  </g>
</svg>
