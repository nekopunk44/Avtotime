worker_processes auto;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # multer accepts files up to 50 MB (middlewars/multer.js); the extra 5 MB
    # covers multipart boundaries and non-file fields in the same request.
    client_max_body_size 55m;
    client_body_timeout 120s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Buffered writes keep the per-request syscall cost down; the docker
    # json-file driver caps the file at 10m x 3 (see docker-compose.yml).
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/html is always compressed and must not be listed here.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    upstream backend {
        zone backend_zone 64k;
        least_conn;
        server backend:8000 resolve;
        keepalive 128;
    }

    # ── HTTP ──────────────────────────────────────────────────────────────────
    # Serves ACME challenge for Certbot; redirects everything else to HTTPS
    server {
        listen 80;
        server_name avtotime.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name avtotime.org;

        # The "-0001" suffix is not a typo. The volume holds two lineages:
        # live/avtotime.org is the self-signed placeholder init-ssl.sh created
        # to let nginx start before the first issuance, and live/avtotime.org-0001
        # is the real Let's Encrypt one (the only one with an archive/ dir, so
        # the only one certbot renews). Pointing at the unsuffixed path serves
        # the self-signed stub to every visitor.
        ssl_certificate     /etc/letsencrypt/live/avtotime.org-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/avtotime.org-0001/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # IMPORTANT: add_header is NOT inherited into a nested context that
        # declares any add_header of its own. The six headers below therefore
        # only cover locations without their own add_header directives; every
        # location that adds one MUST repeat this whole block verbatim.
        # (They are kept inline rather than in an `include` snippet on purpose:
        # a snippet is a second file that must reach the server, and a missing
        # include makes nginx refuse to start — i.e. a full outage.)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Socket.io ──────────────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ── Health probe ───────────────────────────────────────────────────
        # Polled by uptime monitors; kept out of the access log and out of the
        # api rate-limit zone so a monitor can never lock real clients out.
        location = /api/health {
            access_log off;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Uploaded media (express.static under /api/public) ──────────────
        # Longest-prefix match wins, so this bypasses the `api` rate-limit
        # zone: one page with 30 images used to burn the whole 10 r/s budget.
        location /api/public/ {
            access_log off;
            expires 30d;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Auth (stricter limit) ───────────────────────────────────────────
        location ~ ^/api/auth/(signin|signup|sendOtp) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API ────────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # ── Frontend static files ──────────────────────────────────────────
        location / {
            root /var/www/frontend;
            try_files $uri $uri/ /index.html;

            # Security headers repeated: the Cache-Control block below resets
            # inheritance from the server level (see the note there).
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

            # HTML never cached — browser always re-validates
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                access_log off;
                expires 1y;

                # Security headers repeated again for the same reason.
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header X-Frame-Options SAMEORIGIN always;
                add_header X-Content-Type-Options nosniff always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

                add_header Cache-Control "public, immutable";
            }
        }
    }
}
