services:
  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongodb:27017/avtotime
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_ADAPTER_ENABLED: "true"
      TRUST_PROXY: "1"
      PORT: "8000"
    volumes:
      - uploads:/app/public
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ./frontend/dist:/var/www/frontend:ro
      - uploads:/var/www/uploads:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Auto-renew every 12h (Let's Encrypt certs last 90 days)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  mongo_data:
  redis_data:
  uploads:
  letsencrypt:
  certbot_www:
